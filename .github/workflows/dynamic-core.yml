name: Dynamic core
on:
  push:
    branches: [feature/dynamic-core]
  workflow_dispatch:
  workflow_call:
    inputs:
      core_commit:
        type: string
        required: true
      core_version:
        type: string
        required: true
      publish:
        type: boolean
        default: false
    secrets:
      DYNAMIC_CORE_SIGNING_KEY:
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      source: ${{ steps.core.outputs.source }}
      commit: ${{ steps.core.outputs.commit }}
      version: ${{ steps.core.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: workspace/NekoBoxForAndroid
          ref: feature/dynamic-core
          persist-credentials: false
      - name: Resolve immutable core source
        id: core
        working-directory: workspace/NekoBoxForAndroid
        env:
          REQUESTED_COMMIT: ${{ inputs.core_commit }}
          REQUESTED_VERSION: ${{ inputs.core_version }}
        run: |
          source buildScript/lib/core/get_source_env.sh
          commit=${REQUESTED_COMMIT:-$COMMIT_SING_BOX}
          version=${REQUESTED_VERSION:-1.14.4}
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "CORE_COMMIT=$commit" >> "$GITHUB_ENV"
          echo "CORE_VERSION=$version-dynamic.1" >> "$GITHUB_ENV"
          python -m unittest discover -s buildScript/dynamic -p 'test_*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache-dependency-path: workspace/NekoBoxForAndroid/libcore/go.sum
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - name: Restore tested native build
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            workspace/NekoBoxForAndroid/libcore/libcore.aar
            workspace/NekoBoxForAndroid/libcore/gomobile/bind/java/Seq.java
          key: dynamic-native-v2-${{ steps.core.outputs.commit }}-${{ steps.core.outputs.version }}-${{ hashFiles('workspace/NekoBoxForAndroid/libcore/**', 'workspace/NekoBoxForAndroid/buildScript/lib/core/**', 'workspace/NekoBoxForAndroid/buildScript/dynamic/build-core.sh') }}
      - name: Build and test native core
        id: native-build
        if: steps.native-cache.outputs.cache-hit != 'true'
        working-directory: workspace/NekoBoxForAndroid
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash buildScript/dynamic/build-core.sh
      - name: Save tested native build
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            workspace/NekoBoxForAndroid/libcore/libcore.aar
            workspace/NekoBoxForAndroid/libcore/gomobile/bind/java/Seq.java
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Package signed dynamic cores
        working-directory: workspace/NekoBoxForAndroid
        env:
          DYNAMIC_CORE_SIGNING_KEY: ${{ secrets.DYNAMIC_CORE_SIGNING_KEY }}
        run: |
          python -m pip install cryptography
          python buildScript/dynamic/prepare.py --aar libcore/libcore.aar --seq libcore/gomobile/bind/java/Seq.java --android-jar "$ANDROID_HOME/platforms/android-36/android.jar" --version "$CORE_VERSION" --output dynamic-output
      - name: Fetch the immutable compatibility baseline APK
        working-directory: workspace/NekoBoxForAndroid
        run: |
          url=$(jq -r .baseline_apk_url buildScript/dynamic/compatibility.json)
          digest=$(jq -r .baseline_apk_sha256 buildScript/dynamic/compatibility.json)
          curl --fail --location --retry 3 "$url" -o dynamic-output/baseline.apk
          echo "$digest  dynamic-output/baseline.apk" | sha256sum --check -
      - name: Download rule databases
        working-directory: workspace/NekoBoxForAndroid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets/sing-box
          cd app/src/main/assets/sing-box
          for db in geoip geosite; do
            tag=$(gh api "repos/SagerNet/sing-$db/releases/latest" --jq .tag_name)
            printf '%s' "$tag" > "$db.version.txt"
            gh release download "$tag" -R "SagerNet/sing-$db" -p "$db.db"
            xz --keep -9 "$db.db"
          done
      - name: Build and test APK
        working-directory: workspace/NekoBoxForAndroid
        run: |
          ./gradlew :app:testOssDebugUnitTest :app:assembleOssDebug --stacktrace
      - name: Sign APKs with the persistent signing identity
        working-directory: workspace/NekoBoxForAndroid
        env:
          DYNAMIC_CORE_SIGNING_KEY: ${{ secrets.DYNAMIC_CORE_SIGNING_KEY }}
        run: |
          signer="$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar"
          javac -cp "$signer" -d dynamic-output/java buildScript/dynamic/SignApk.java
          for abi in arm64-v8a x86_64; do
            apk=$(find app/build/outputs/apk/oss/debug -name "*$abi*.apk" | head -1)
            test -n "$apk"
            java -cp "dynamic-output/java:$signer" SignApk dynamic-output/signer.der "$apk" "dynamic-output/NekoBox-Dynamic-$abi.apk"
          done
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/upload-artifact@v4
        with:
          name: nekobox-dynamic
          path: |
            workspace/NekoBoxForAndroid/dynamic-output/NekoBox-Dynamic-*.apk
            workspace/NekoBoxForAndroid/dynamic-output/*.zip
            workspace/NekoBoxForAndroid/app/src/main/assets/dynamic-core/binding.txt
          if-no-files-found: error
          retention-days: 14
      - name: Test loading, data plane, switching and recovery on an isolated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          working-directory: workspace/NekoBoxForAndroid
          disable-animations: true
          script: bash buildScript/dynamic/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-test-results
          path: workspace/NekoBoxForAndroid/app/build/reports/tests/
  publish:
    needs: build
    # Also exercise metadata generation after successful push builds / verification runs.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: nekobox-dynamic
          path: verified-output
      - name: Publish only when every compatibility check passed
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          COMMIT: ${{ needs.build.outputs.commit }}
          SOURCE: ${{ needs.build.outputs.source }}
          PUBLISH: ${{ inputs.publish }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          args=()
          if [[ "$PUBLISH" != true ]]; then args+=(--dry-run); fi
          python buildScript/dynamic/publish.py --version "$VERSION" --commit "$COMMIT" --source "$SOURCE" --run-url "$RUN_URL" --directory verified-output/dynamic-output "${args[@]}"
